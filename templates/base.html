<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block titulo %}Dojo Manager{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; }
        .navbar-brand { font-weight: bold; letter-spacing: 1px; }
        .sidebar { min-height: calc(100vh - 56px); background-color: #212529; }
        .sidebar a { color: #adb5bd; text-decoration: none; display: block; padding: 10px 20px; }
        .sidebar a:hover { color: #fff; background-color: #343a40; }
        .sidebar a.active { color: #fff; border-left: 3px solid #0d6efd; }
        .content { padding: 30px; }
        @media (max-width: 768px) { .content { padding: 15px; } }
    </style>
</head>
<body>

    {% include 'partials/navbar.html' %}

    <div class="container-fluid">
        <div class="row">
            {% include 'partials/sidebar.html' %}
            <div class="col-md-10 content">
                {% include 'partials/messages.html' %}
                {% block contenido %}{% endblock %}
            </div>
        </div>
    </div>

    {% include 'partials/bottom_nav.html' %}

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
