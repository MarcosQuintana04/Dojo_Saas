<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block titulo %}Dojo Manager{% endblock %}</title>

    <!-- Bootstrap 5 — nos da estilos y responsive gratis -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">

    <style>
        body { background-color: #f8f9fa; }
        .navbar-brand { font-weight: bold; letter-spacing: 1px; }
        .sidebar { min-height: calc(100vh - 56px); background-color: #212529; }
        .sidebar a { color: #adb5bd; text-decoration: none; display: block; padding: 10px 20px; }
        .sidebar a:hover { color: #fff; background-color: #343a40; }
        .sidebar a.active { color: #fff; border-left: 3px solid #0d6efd; }
        .content { padding: 30px; }
    </style>
</head>
<body>

    <!-- NAVBAR -->
    <nav class="navbar navbar-dark bg-dark px-3">
        <span class="navbar-brand">
            <i class="bi bi-shield-fill"></i> Dojo Manager
        </span>

        <!-- Muestra el usuario logueado y botón de logout -->
        {% if user.is_authenticated %}
        <div class="d-flex align-items-center gap-3">
            <span class="text-secondary small">
                <i class="bi bi-person-circle me-1"></i>{{ user.username }}
            </span>
            <form method="POST" action="{% url 'logout' %}" class="m-0">
                {% csrf_token %}
                <button type="submit" class="btn btn-sm btn-outline-secondary">
                    <i class="bi bi-box-arrow-right me-1"></i>Salir
                </button>
            </form>
        </div>
        {% endif %}
    </nav>

    <div class="container-fluid">
        <div class="row">

            <!-- SIDEBAR -->
            <div class="col-md-2 sidebar d-none d-md-block pt-3">
                <a href="{% url 'alumnos:lista' %}" 
                   class="{% if request.resolver_match.app_name == 'alumnos' %}active{% endif %}">
                    <i class="bi bi-people-fill me-2"></i> Alumnos
                </a>
                <!-- Aquí agregaremos Asistencias y Pagos en fases futuras -->
            </div>

            <!-- CONTENIDO PRINCIPAL -->
            <div class="col-md-10 content">

                <!-- MENSAJES (success, error, etc.) -->
                {% for message in messages %}
                    <div class="alert alert-{{ message.tags }} alert-dismissible fade show" role="alert">
                        {{ message }}
                        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                    </div>
                {% endfor %}

                <!-- Cada página hija define qué va aquí -->
                {% block contenido %}{% endblock %}

            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
