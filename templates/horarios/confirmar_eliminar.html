{% extends 'base.html' %}
{% block titulo %}Eliminar clase — Berserker Ronin{% endblock %}

{% block contenido %}
<div class="row justify-content-center">
    <div class="col-md-5 text-center">
        <i class="bi bi-exclamation-triangle text-warning" style="font-size: 3rem;"></i>
        <h3 class="mt-3">¿Eliminar {{ clase.nombre }}?</h3>
        <p class="text-muted">Se eliminarán también todas las inscripciones de esta clase.</p>
        <form method="POST" class="d-flex justify-content-center gap-3 mt-4">
            {% csrf_token %}
            <a href="{% url 'horarios:detalle' clase.pk %}" class="btn btn-outline-secondary">Cancelar</a>
            <button type="submit" class="btn btn-danger">Confirmar eliminación</button>
        </form>
    </div>
</div>
{% endblock %}
