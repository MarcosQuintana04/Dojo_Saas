<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block titulo %}Portal — Berserker Ronin{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; padding-bottom: 70px; }
        .portal-header {
            background: linear-gradient(135deg, #212529 0%, #0d6efd 100%);
            color: white;
            padding: 16px 20px;
        }
    </style>
</head>
<body>

    <!-- Header del portal -->
    <div class="portal-header d-flex justify-content-between align-items-center">
        <div class="d-flex align-items-center gap-3">
            {% if alumno.foto %}
                <img src="{{ alumno.foto.url }}"
                     class="rounded-circle"
                     style="width:40px; height:40px; object-fit:cover;">
            {% else %}
                <div class="rounded-circle bg-white bg-opacity-25 d-flex align-items-center justify-content-center"
                     style="width:40px; height:40px;">
                    <i class="bi bi-person-fill text-white"></i>
                </div>
            {% endif %}
            <div>
                <div class="fw-semibold">{{ alumno.nombre }}</div>
                <small class="opacity-75">
                    {{ alumno.get_disciplina_display }} · {{ alumno.get_cinturon_display }}
                </small>
            </div>
        </div>
        <form method="POST" action="{% url 'portal:logout' %}">
            {% csrf_token %}
            <button type="submit" class="btn btn-sm btn-outline-light">
                <i class="bi bi-box-arrow-right"></i>
            </button>
        </form>
    </div>

    <!-- Contenido -->
    <div class="container py-4">
        {% for message in messages %}
        <div class="alert alert-{{ message.tags }} alert-dismissible fade show">
            {{ message }}
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
        {% endfor %}
        {% block contenido %}{% endblock %}
    </div>

    <!-- Navegación inferior del portal -->
    <nav class="fixed-bottom navbar navbar-light bg-white border-top px-0">
        <div class="container-fluid justify-content-around">

            <a href="{% url 'portal:inicio' %}"
               class="d-flex flex-column align-items-center text-decoration-none py-2 px-3
               {% if request.resolver_match.url_name == 'inicio' %}text-primary{% else %}text-secondary{% endif %}">
                <i class="bi bi-house-fill" style="font-size: 1.4rem;"></i>
                <small style="font-size: 0.65rem;">Inicio</small>
            </a>

            <a href="{% url 'portal:asistencias' %}"
               class="d-flex flex-column align-items-center text-decoration-none py-2 px-3
               {% if request.resolver_match.url_name == 'asistencias' %}text-primary{% else %}text-secondary{% endif %}">
                <i class="bi bi-calendar-check" style="font-size: 1.4rem;"></i>
                <small style="font-size: 0.65rem;">Asistencias</small>
            </a>

            <a href="{% url 'portal:pagos' %}"
               class="d-flex flex-column align-items-center text-decoration-none py-2 px-3
               {% if request.resolver_match.url_name == 'pagos' %}text-primary{% else %}text-secondary{% endif %}">
                <i class="bi bi-cash-stack" style="font-size: 1.4rem;"></i>
                <small style="font-size: 0.65rem;">Pagos</small>
            </a>

            <a href="{% url 'portal:horario' %}"
               class="d-flex flex-column align-items-center text-decoration-none py-2 px-3
               {% if request.resolver_match.url_name == 'horario' %}text-primary{% else %}text-secondary{% endif %}">
                <i class="bi bi-calendar-week" style="font-size: 1.4rem;"></i>
                <small style="font-size: 0.65rem;">Horario</small>
            </a>

        </div>
    </nav>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
