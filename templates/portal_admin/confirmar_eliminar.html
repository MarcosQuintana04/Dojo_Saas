{% extends 'base.html' %}
{% block titulo %}Eliminar cuenta — Berserker Ronin{% endblock %}

{% block contenido %}
<div class="row justify-content-center">
    <div class="col-md-5 text-center">
        <i class="bi bi-exclamation-triangle text-warning" style="font-size: 3rem;"></i>
        <h3 class="mt-3">¿Eliminar cuenta de {{ perfil.alumno.nombre }}?</h3>
        <p class="text-muted">
            El alumno ya no podrá acceder al portal.
            Sus datos de asistencias y pagos no se borran.
        </p>
        <form method="POST" class="d-flex justify-content-center gap-3 mt-4">
            {% csrf_token %}
            <a href="{% url 'portal_admin:lista_cuentas' %}"
               class="btn btn-outline-secondary">Cancelar</a>
            <button type="submit" class="btn btn-danger">Confirmar</button>
        </form>
    </div>
</div>
{% endblock %}
